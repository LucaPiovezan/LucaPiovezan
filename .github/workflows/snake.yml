name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: LucaPiovezan
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=#F2F0EF&color_snake_border=#282828&color_dots=#161b22,#1f2937,#374151,#4b5563,#6b7280

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
